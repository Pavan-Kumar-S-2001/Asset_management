services:
  backend:
    build: ./backend
    container_name: asset_backend
    
    environment:
      DATA_DIR: /app/data
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: asset_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
