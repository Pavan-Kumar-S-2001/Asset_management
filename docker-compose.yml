version: "3.9"

services:

  backend:
    build: ./backend
    container_name: asset_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    environment:
      - FLASK_ENV=development
    restart: always

  frontend:
    build: ./frontend
    container_name: asset_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data: