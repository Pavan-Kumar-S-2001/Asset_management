version: "3.9"

services:

  backend:
    build: ./backend
    container_name: asset_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    image: node:20
    container_name: asset_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend